[package]
name = "document2html-core"
version = "2.0.2"
edition = "2024"
description = "Format-neutral document-to-HTML conversion core"
license = "MIT"
repository = "https://github.com/brnyxx/pptx2html-turbo"
keywords = ["document", "html", "converter", "office", "pdf"]
categories = ["parser-implementations"]

[dependencies]
cfb = "0.14"
pptx2html-core = { path = "../pptx2html-core" }
quick-xml = "0.37"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
