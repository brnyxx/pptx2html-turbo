[package]
name = "pptx2html-cli"
version = "2.0.1"
edition = "2024"
default-run = "pptx2html"
description = "CLI tool for converting PPTX to HTML"
license = "MIT"
repository = "https://github.com/brnyxx/pptx2html-turbo"
keywords = ["pptx", "html", "cli", "converter", "presentation"]
categories = ["command-line-utilities"]

[dependencies]
document2html-core = { path = "../document2html-core" }
document2html-native = { path = "../document2html-native" }
pptx2html-core = { path = "../pptx2html-core" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
same-file = "1.0.6"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "pptx2html"
path = "src/main.rs"

[[bin]]
name = "document2html"
path = "src/document2html.rs"
