[package]
name = "document2html-native"
version = "2.1.0"
edition = "2024"
description = "Native Office and PDF backends for document2html"
license = "MIT"
repository = "https://github.com/brnyxx/pptx2html-turbo"
keywords = ["document", "html", "converter", "office", "pdf"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.22"
document2html-core = { path = "../document2html-core" }
log = "0.4"
thiserror = "2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
