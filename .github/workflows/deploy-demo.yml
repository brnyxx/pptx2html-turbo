name: Deploy Demo

on:
  push:
    branches: [main]
    paths:
      - 'crates/pptx2html-wasm/**'
      - 'crates/pptx2html-core/**'
      - 'evaluate/completeness_manifest.json'
      - 'scripts/render_demo_capabilities.mjs'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy Demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install wasm-pack
        run: |
          if ! wasm-pack --version 2>/dev/null | grep -qx 'wasm-pack 0.14.0'; then
            cargo install wasm-pack --version 0.14.0 --locked --force
          fi

      - name: Build WASM
        run: wasm-pack build crates/pptx2html-wasm --target web --release

      - name: Validate demo contracts
        run: |
          VERSION=$(bash scripts/read_release_version.sh)
          mkdir -p "$RUNNER_TEMP/pptx2html-capabilities"
          node scripts/render_demo_capabilities.mjs \
            --manifest evaluate/completeness_manifest.json \
            --template crates/pptx2html-wasm/demo/capabilities.template.html \
            --output "$RUNNER_TEMP/pptx2html-capabilities/index.html"
          node crates/pptx2html-wasm/tests/demo-contract.mjs "$VERSION"
          node crates/pptx2html-wasm/tests/capabilities-contract.mjs \
            "$RUNNER_TEMP/pptx2html-capabilities/index.html" \
            evaluate/completeness_manifest.json
          node crates/pptx2html-wasm/tests/release-version-contract.mjs
          python3 evaluate/check_exactness_contract.py --repo-root . \
            --output-json "$RUNNER_TEMP/pptx2html-capabilities/exactness-contract.json"

      - name: Assemble site
        run: |
          mkdir -p _site/pkg _site/capabilities
          cp crates/pptx2html-wasm/demo/index.html _site/
          cp crates/pptx2html-wasm/pkg/pptx2html_wasm.js _site/pkg/
          cp crates/pptx2html-wasm/pkg/pptx2html_wasm_bg.wasm _site/pkg/
          cp crates/pptx2html-wasm/pkg/pptx2html_wasm.d.ts _site/pkg/
          cp crates/pptx2html-wasm/npm/index.js _site/pkg/
          node scripts/render_demo_capabilities.mjs \
            --manifest evaluate/completeness_manifest.json \
            --template crates/pptx2html-wasm/demo/capabilities.template.html \
            --output _site/capabilities/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
