name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: '@briank-dev/pptx-to-html'
  PACKAGE_AUTHOR: 'Brian Kim <hyungjoo.drb@gmail.com>'
  PACKAGE_HOMEPAGE: 'https://github.com/brnyxx/pptx2html-turbo'
  PACKAGE_BUGS_URL: 'https://github.com/brnyxx/pptx2html-turbo/issues'
  PACKAGE_DESCRIPTION: 'Convert PPTX slides to high-fidelity HTML in the browser — pure Rust/WASM, zero dependencies'

jobs:
  validate-workspace:
    name: Validate Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check release tag against workspace version
        run: |
          chmod +x scripts/read_release_version.sh
          bash scripts/read_release_version.sh "${{ github.ref_name }}"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: pptx2html
            document_artifact: document2html
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: pptx2html
            document_artifact: document2html
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: pptx2html
            document_artifact: document2html
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: pptx2html
            document_artifact: document2html
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: pptx2html.exe
            document_artifact: document2html.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --package pptx2html-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../pptx2html-${{ matrix.target }}.tar.gz \
            ${{ matrix.artifact }} ${{ matrix.document_artifact }}

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../pptx2html-${{ matrix.target }}.zip ${{ matrix.artifact }} ${{ matrix.document_artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pptx2html-${{ matrix.target }}
          path: pptx2html-${{ matrix.target }}.*

  validate-bindings:
    name: Validate Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install maturin
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements-release.txt
      - name: Install wasm-pack
        run: |
          if ! wasm-pack --version 2>/dev/null | grep -qx 'wasm-pack 0.14.0'; then
            cargo install wasm-pack --version 0.14.0 --locked --force
          fi
      - name: Read release version
        run: |
          chmod +x scripts/read_release_version.sh
          VERSION=$(bash scripts/read_release_version.sh "${{ github.ref_name }}")
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build Python wheels
        run: |
          python -m maturin build --release --manifest-path crates/pptx2html-py/Cargo.toml --features extension-module --interpreter python --out dist/pptx2html
          python -m maturin build --release --manifest-path crates/document2html-py/Cargo.toml --features extension-module --interpreter python --out dist/document2html
      - name: Install wheels and run runtime smoke tests
        run: |
          python -m pip install dist/pptx2html/*.whl dist/document2html/*.whl
          python -m unittest discover -s crates/pptx2html-py/tests -v
          python -m unittest discover -s crates/document2html-py/tests -v
      - name: Prepare validated WASM package
        run: bash scripts/prepare_wasm_release_package.sh "$PACKAGE_VERSION"

  validate-release:
    name: Validate Release Evidence
    needs: [validate-workspace, build, validate-bindings]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # master
        with:
          toolchain: 1.95.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install evaluate test dependencies
        run: python -m pip install -r evaluate/requirements-test.txt
      - name: Install Chromium test runtime
        run: python -m playwright install --with-deps chromium
      - name: Install PDF tooling
        run: brew install poppler
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Run evaluate helper tests
        run: python3 -m unittest discover -s evaluate/tests -p 'test_*.py' -v
      - name: Check exactness contract
        run: |
          mkdir -p artifacts/evaluate
          python3 evaluate/check_exactness_contract.py --repo-root . --output-json artifacts/evaluate/exactness-contract-report.json
      - name: Generate PowerPoint evidence summary
        run: |
          python evaluate/powerpoint_evidence.py summary --golden-set-dir evaluate/golden_set --output-dir evaluate/powerpoint_golden --output-json artifacts/evaluate/powerpoint-evidence-summary.json
          python evaluate/powerpoint_evidence.py gate --family text-layout --golden-set-dir evaluate/golden_set --output-dir evaluate/powerpoint_golden --output-json artifacts/evaluate/powerpoint-evidence-text-layout-gate.json || true
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence
          path: artifacts/evaluate

  release:
    name: Create Release
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
