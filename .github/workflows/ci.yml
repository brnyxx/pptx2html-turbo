name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: '@briank-dev/pptx-to-html'
  PACKAGE_AUTHOR: 'Brian Kim <hyungjoo.drb@gmail.com>'
  PACKAGE_HOMEPAGE: 'https://github.com/kim62210/pptx2html-turbo'
  PACKAGE_BUGS_URL: 'https://github.com/kim62210/pptx2html-turbo/issues'
  PACKAGE_DESCRIPTION: 'Convert PPTX slides to high-fidelity HTML in the browser — pure Rust/WASM, zero dependencies'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Build release
        run: cargo build --workspace --release --exclude pptx2html-py

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Install browser smoke dependencies
        run: python -m pip install -r evaluate/requirements-test.txt
      - name: Install Chromium test runtime
        run: python -m playwright install --with-deps chromium
      - name: Prepare validated WASM package
        run: |
          VERSION=$(bash scripts/read_release_version.sh)
          bash scripts/prepare_wasm_release_package.sh "$VERSION"
      - name: Validate Pages demo contracts
        run: |
          VERSION=$(bash scripts/read_release_version.sh)
          node crates/pptx2html-wasm/tests/demo-contract.mjs "$VERSION"
          node crates/pptx2html-wasm/tests/release-version-contract.mjs
      - name: Verify package artifacts
        run: |
          test -f crates/pptx2html-wasm/pkg/package.json
          test -f crates/pptx2html-wasm/pkg/index.js
          test -f crates/pptx2html-wasm/pkg/index.d.ts
          test -f crates/pptx2html-wasm/pkg/pptx2html_wasm.js
          test -f crates/pptx2html-wasm/pkg/pptx2html_wasm.d.ts
          test -f crates/pptx2html-wasm/pkg/pptx2html_wasm_bg.wasm
          echo "All WASM artifacts present"
      - name: Run WASM runtime smoke test
        run: node crates/pptx2html-wasm/tests/node-smoke.mjs
      - name: Run browser package smoke
        run: python3 crates/pptx2html-wasm/tests/package_browser_smoke.py
  python-bindings:
    name: Python Bindings Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@v2
      - name: Install maturin
        run: python -m pip install maturin
      - name: Build Python wheel
        run: python -m maturin build --manifest-path crates/pptx2html-py/Cargo.toml --features extension-module --interpreter python --out dist
      - name: Verify wheel artifact
        run: |
          ls dist/*.whl
          echo "Python wheel build succeeded"
      - name: Install wheel and run runtime smoke tests
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s crates/pptx2html-py/tests -v
  evaluate-tools:
    name: Evaluate Tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install evaluate test dependencies
        run: python -m pip install -r evaluate/requirements-test.txt
      - name: Install Chromium test runtime
        run: python -m playwright install --with-deps chromium
      - name: Run evaluate helper tests
        run: python3 -m unittest discover -s evaluate/tests -p 'test_*.py' -v
      - name: Check exactness contract
        run: |
          mkdir -p artifacts/evaluate
          python3 evaluate/check_exactness_contract.py --repo-root . --output-json artifacts/evaluate/exactness-contract-report.json
      - name: Generate PowerPoint evidence reports
        run: |
          python evaluate/powerpoint_evidence.py summary --golden-set-dir evaluate/golden_set --output-dir evaluate/powerpoint_golden --output-json artifacts/evaluate/powerpoint-evidence-summary.json
          python evaluate/powerpoint_evidence.py gate --family text-layout --golden-set-dir evaluate/golden_set --output-dir evaluate/powerpoint_golden --output-json artifacts/evaluate/powerpoint-evidence-text-layout-gate.json || true
      - name: Run strict PowerPoint pixel gate when evidence exists
        shell: bash
        run: |
          if [[ -f evaluate/powerpoint_golden/manifest.json ]]; then
            python evaluate/strict_pixel_compare.py \
              --golden-set-dir evaluate/golden_set \
              --reference-dir evaluate/powerpoint_golden \
              --candidate-dir evaluate/candidates \
              --diff-dir artifacts/evaluate/pixel-diffs \
              --output-json artifacts/evaluate/strict-pixel-report.json
          else
            printf '%s\n' '{"ok":false,"status":"awaiting-powerpoint-native-evidence"}' \
              > artifacts/evaluate/strict-pixel-report.json
          fi
      - name: Upload evaluate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: evaluate-artifacts
          path: artifacts/evaluate
